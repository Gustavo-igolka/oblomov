{t:'Глава 8. Бежать нельзя лежать',l:['Штольц предлагает движение. Обломов','предлагает обсудить движение позже.','Компромисс не найден. Поэтому Илья','просто начинает бежать. Иногда это проще.']},
{t:'Глава 9. Сон',a:'a6',l:['Устав от Петербурга и собственного движения,','Обломов засыпает. Перед ним раскрывается','Обломовка: вечное лето, тихая речка','и пироги, которым некуда торопиться.']},
{t:'Глава 10. Обломовка',l:['Здесь никто не спрашивает, сколько дел','ты сделал за день. Здесь важнее, успел ли','ты пообедать и достаточно ли долго','отдыхал после обеда. Илья узнаёт этот мир.']},
{t:'Глава 11. Ольга',a:'a7',l:['Весной появляется Ольга Ильинская.','Она не спорит с Обломовым о его лени —','она просто зовёт его вперёд. Впервые','ему хочется двигаться не потому, что надо.']},
{t:'Глава 12. Догоняй!',l:['Андрей и Ольга уезжают на велосипеде.','Илья смотрит им вслед и вдруг понимает:','если он останется на месте, то потеряет','не письмо и не деньги, а людей. Он бежит.']},
{t:'Глава 13. Железный друг',a:'a12',l:['Штольц снова появляется с портфелем.','Для него дела — не наказание, а способ','двигаться вперёд. «Илья, — говорит он, —','я не могу прожить жизнь вместо тебя».']},
{t:'Глава 14. Розовое пятно',l:['Но мир начинает странно меняться.','Среди обычных препятствий появляются','розовые вспышки. Их нельзя просто обойти:','они будто отмечают места, где правила мира ломаются.']},
{t:'Глава 15. Бета-Штольц',a:'a43',l:['Штольц возвращается уже не как помощник,','а как испытание. Розовые препятствия','оказываются его слабостью: чтобы победить,','Илья должен впервые сам рискнуть и врезаться.']},
{t:'Глава 16. Края страницы',a:'a17',l:['После погони улица вдруг заканчивается.','Дорога превращается в строку, дома — в буквы,','а небо становится белым листом. Илья понимает:','он больше не просто герой. Он внутри книги.']},
{t:'Глава 17. Автор',a:'a14',l:['Гончаров смотрит сверху, словно хозяин сцены.','Он знает, где Обломов должен остановиться,','где испугаться и где снова лечь. Но розовые','строки остаются пустыми — автор не решил всё.']},
{t:'Глава 18. Розовая мечта',a:'a16',l:['Илья замечает странность: розовые места','не причиняют обычного вреда. Наоборот —','они словно зовут героя вперёд. Может быть,','это ошибки автора. А может, выход из книги.']},
{t:'Глава 19. Человек против страницы',l:['Гончаров заставляет мир ускоряться.','Обломов впервые не убегает от сюжета —','он спорит с ним собственными поступками.','Каждый шаг становится маленькой поправкой к книге.']},
{t:'Глава 20. Чистая страница',a:'a14',l:['Десять ударов — и перо падает из рук.','Гончаров улыбается: «Теперь пиши сам».','Перед Ильёй чистая страница. Но написать','на ней легко только одно: самому выбрать путь.']},
{t:'Глава 21. Домой?',l:['Илья возвращается в Петербург.','Диван стоит там же, Захар ворчит так же,','но сам Обломов уже другой. Он понял:','отдыхать можно и после того, как ты встал.']},
{t:'Эпилог. Диван',a:'a15',l:['Диван теперь не клетка, а выбор.','Илья ложится, когда хочет, и встаёт,','когда решает сам. Захар приносит халат','и подозрительно радуется. Конец первой книги?']},
{t:'Мир 2. Чернильное пятно',a:'a18',l:['На чистой странице Илья написал одно слово:','«встать». Чернила расплылись пятном —','и пятно стало дверью в соседнюю книгу.','На корешке было написано: «Достоевский».']},
{t:'Мир 2. Сенная',a:'a19',l:['Жёлтые дома, мокрый булыжник и туман.','Здесь никто не обещает «завтра».','На каждом углу спорят о деньгах, совести','и странном человеке с топором.']},
{t:'Мир 2. Тень Раскольникова',l:['Сначала Илья видит одного Раскольникова.','Потом второго. Потом третьего.','Все похожи, но никто не признаётся,','который из них настоящий.']},
{t:'Мир 2. Сон Обломова 2',a:'a20',l:['Обломовка возвращается, но теперь','это уже не тёплый сон. Пироги летят','как снаряды, дорога исчезает из-под ног,','а спокойствие становится подозрительным.']},
{t:'Мир 2. Штольц вернулся',a:'a21',l:['Из тумана выходит Штольц — теперь','с двойным портфелем. «Я вытащил тебя','из дивана, Илья. Теперь вытащу из этого сна».','И действительно, дела летят сразу волнами.']},
{t:'Мир 2. Тварь ли я дрожащая?',a:'a22',l:['Раскольников спорит сам с собой.','Илья не спорит — он бежит. Иногда','побег тоже становится ответом. Вопрос лишь','в том, чей это ответ: героя или автора?']},
{t:'Мир 2. Настоящий',a:'a31',l:['Все Раскольниковы на Сенной — подделки,','тени одной идеи. Настоящий — один.','Он не бежит, а летит, и топор у него','фиолетовый. Чтобы остановить его, нужен свой.']},
{t:'Мир 2. Последняя улица',l:['Туман сгущается, а две книги начинают','переплетаться. Петербург Достоевского','видит вдали белые страницы Гончарова.','Похоже, кто-то снова написал продолжение.']},
{t:'Мир 2. Автор',a:'a24',l:['На каждом углу появляется один и тот же','бородатый человек. «Ты не мой герой, —','вздыхает Фёдор Михайлович, — но с тобой','в романе становится неожиданно светлее».']}];

   c.k=w;c.v=0;c.a.volume=0;c.a.loop=w!='over';c.a.src='music/'+F[w]+'.mp3';c.a.play().catch(()=>{})}
  for(const c of ch){const tg=c.k&&c.k==w?VOL*(st=='pause'?.3:1):0;
   c.v+=Math.max(-dt*.8,Math.min(dt*.8,tg-c.v));c.a.volume=Math.max(0,Math.min(1,c.v));
   if(c.k&&c.k!=w&&c.v<=.001){c.a.pause();c.k=null}}}
 return{tick,toggle,on:()=>on}})();

}
MU.tick(dt);requestAnimationFrame(loop)})(last);
